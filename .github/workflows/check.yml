name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: Flake check
    # Local development covers aarch64-darwin and aarch64-linux; this job
    # covers x86_64-linux, including the Linux-only checks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix flake check --no-update-lock-file --print-build-logs

  # The CI layer on this repository, with the run-local adapter.
  ci:
    name: CI layer
    uses: ./.github/workflows/ci.yml
    with:
      declaration: .#ci.x86_64-linux
      ci-command: nix run .#ci --
