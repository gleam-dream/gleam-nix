# Reusable workflow for the gleam-nix CI layer: plan, then the shared builds,
# then each missing check, then one verdict. Call it from a job whose name is
# your required check:
#
#   jobs:
#     ci:
#       uses: gleam-dream/gleam-nix/.github/workflows/ci.yml@ci-v1
#       with:
#         declaration: .#ci.x86_64-linux
#       secrets: inherit
#
# The cache adapter is part of the declaration. A run without a write
# credential carries results between its jobs in a run-local store and is
# reported as degraded.
name: gleam-nix CI

on:
  workflow_call:
    inputs:
      declaration:
        description: Flake reference to the CI declaration, such as .#ci.x86_64-linux.
        type: string
        required: true
      runs-on:
        type: string
        default: ubuntu-24.04
      ci-command:
        description: How to run gleam-nix-ci. Defaults to this workflow's own revision.
        type: string
        default: ""
      external:
        description: JSON object mapping each external job's name to the command it runs.
        type: string
        default: "{}"
      publish-command:
        description: Run on the default branch after verify, such as an image push.
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      ATTIC_TOKEN:
        required: false

permissions:
  contents: read

env:
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
  GLEAM_NIX_CI_LOCAL_STORE: ${{ github.workspace }}/../gleam-nix-store

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      shared: ${{ steps.plan.outputs.shared }}
      checks: ${{ steps.plan.outputs.checks }}
      external: ${{ steps.plan.outputs.external }}
      command: ${{ steps.command.outputs.command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - id: command
        env:
          COMMAND: ${{ inputs.ci-command }}
          REVISION: ${{ github.job_workflow_sha }}
        run: |
          if [ -z "$COMMAND" ]; then
            COMMAND="nix run github:gleam-dream/gleam-nix/$REVISION#ci --"
          fi
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          COMMAND: ${{ steps.command.outputs.command }}
          DECLARATION: ${{ inputs.declaration }}
        run: $COMMAND plan "$DECLARATION" --out plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gleam-nix-plan
          path: plan.json

  shared:
    needs: plan
    if: needs.plan.outputs.shared != '[]'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gleam-nix-plan
      - env:
          COMMAND: ${{ needs.plan.outputs.command }}
          DECLARATION: ${{ inputs.declaration }}
        run: $COMMAND build "$DECLARATION" --shared plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gleam-nix-store-shared
          path: ${{ env.GLEAM_NIX_CI_LOCAL_STORE }}
          if-no-files-found: ignore

  checks:
    needs: [plan, shared]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.shared.result != 'failure' && needs.plan.outputs.checks != '[]' }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gleam-nix-store-*
          path: ${{ env.GLEAM_NIX_CI_LOCAL_STORE }}
          merge-multiple: true
      - env:
          COMMAND: ${{ needs.plan.outputs.command }}
          DECLARATION: ${{ inputs.declaration }}
          CHECK: ${{ matrix.check }}
        run: $COMMAND build "$DECLARATION" --check "$CHECK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gleam-nix-store-${{ matrix.check }}
          path: ${{ env.GLEAM_NIX_CI_LOCAL_STORE }}
          if-no-files-found: ignore

  external:
    needs: plan
    if: needs.plan.outputs.external != '[]'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.external) }}
    name: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - env:
          RUN: ${{ fromJSON(inputs.external)[matrix.job] }}
        run: bash -euo pipefail -c "$RUN"
      # Passing marks the job done by convention: its marker is trusted, not proved.
      - env:
          COMMAND: ${{ needs.plan.outputs.command }}
          DECLARATION: ${{ inputs.declaration }}
          JOB: ${{ matrix.job }}
        run: $COMMAND build "$DECLARATION" --external "$JOB"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gleam-nix-store-external-${{ matrix.job }}
          path: ${{ env.GLEAM_NIX_CI_LOCAL_STORE }}
          if-no-files-found: ignore

  # The only job that decides the run. It ignores how the other jobs ended:
  # every declared result must substitute, so a skipped job never passes.
  verify:
    needs: [plan, shared, checks, external]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gleam-nix-store-*
          path: ${{ env.GLEAM_NIX_CI_LOCAL_STORE }}
          merge-multiple: true
      - env:
          COMMAND: ${{ needs.plan.outputs.command }}
          DECLARATION: ${{ inputs.declaration }}
        run: $COMMAND verify "$DECLARATION"

  publish:
    needs: verify
    if: inputs.publish-command != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - env:
          RUN: ${{ inputs.publish-command }}
        run: bash -euo pipefail -c "$RUN"
